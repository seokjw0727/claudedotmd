<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1280 400"
     width="1280" height="400"
     role="img"
     aria-label="CLAUDE.md — Personal behavior protocol for Claude Code">
  <defs>
    <style type="text/css"><![CDATA[
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&display=swap');
      @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
      .t-mono { font-family: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
      .t-kr   { font-family: "Pretendard", "Pretendard Variable", system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
    ]]></style>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"    stop-color="#F5F1EA"/>
      <stop offset="0.55" stop-color="#EFE9DD"/>
      <stop offset="1"    stop-color="#E7DFCE"/>
    </linearGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7"/>
      <feColorMatrix values="0 0 0 0 0.12
                             0 0 0 0 0.10
                             0 0 0 0 0.08
                             0 0 0 0.04 0"/>
    </filter>
    <pattern id="dots" x="0" y="0" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="0.8" fill="#1F1B16" opacity="0.18"/>
    </pattern>
    <clipPath id="clip">
      <rect x="0" y="0" width="1280" height="400"/>
    </clipPath>
  </defs>

  <rect width="1280" height="400" fill="url(#paper)"/>
  <rect width="1280" height="400" fill="url(#paper)" filter="url(#grain)" opacity="0.55"/>

  <g clip-path="url(#clip)">
    <rect x="40" y="40" width="1200" height="320" fill="none"
          stroke="#1F1B16" stroke-opacity="0.14" stroke-width="1"/>

    <g class="t-mono" font-size="11" fill="#6B6357" letter-spacing="2">
      <text x="56" y="68">FILE · MARKDOWN · v2026.05</text>
      <text x="1224" y="68" text-anchor="end">~/.config/claude/CLAUDE.md</text>
    </g>
    <line x1="56" y1="80" x2="1224" y2="80" stroke="#1F1B16" stroke-opacity="0.10"/>

    <g>
      <text class="t-mono" x="56" y="218"
            font-size="148" font-weight="600"
            fill="#CC785C" letter-spacing="-4">CLAUDE</text>
      <text class="t-mono" x="668" y="218"
            font-size="148" font-weight="300"
            fill="#1F1B16" fill-opacity="0.32" letter-spacing="-4">.md</text>
      <rect x="908" y="100" width="14" height="128" fill="#CC785C" opacity="0.85">
        <animate attributeName="opacity" values="0.85;0;0.85" dur="1.1s" repeatCount="indefinite"/>
      </rect>
    </g>

    <text class="t-kr" x="60" y="272"
          font-size="26" font-weight="500"
          fill="#2D2A24" letter-spacing="0.5">Claude Code를 위한 개인 행동 규약</text>

    <g class="t-mono" font-size="13" fill="#6B6357" letter-spacing="1.2">
      <text x="60" y="312">Personal behavior protocol</text>
      <text x="296" y="312" fill="#1F1B16" fill-opacity="0.25">·</text>
      <text x="316" y="312">Synced via WebFetch</text>
    </g>

    <line x1="56" y1="340" x2="1224" y2="340" stroke="#1F1B16" stroke-opacity="0.10"/>
    <g class="t-mono" font-size="11" fill="#6B6357" letter-spacing="2">
      <text x="56"   y="360">UTF-8</text>
      <text x="160"  y="360">LF</text>
      <text x="220"  y="360">2.4 KB</text>
      <text x="320"  y="360">last edit · today</text>
      <text x="1224" y="360" text-anchor="end" fill="#CC785C">● live</text>
    </g>

    <g class="t-mono" font-size="10" fill="#6B6357" letter-spacing="1.5" opacity="0.7">
      <text x="1224" y="156" text-anchor="end">§ 01 · TONE</text>
      <text x="1224" y="174" text-anchor="end">§ 02 · WORKFLOW</text>
      <text x="1224" y="192" text-anchor="end">§ 03 · GUARDRAILS</text>
      <text x="1224" y="210" text-anchor="end">§ 04 · OUTPUT</text>
    </g>

    <rect x="1132" y="232" width="92" height="60" fill="url(#dots)"/>
  </g>
</svg>
